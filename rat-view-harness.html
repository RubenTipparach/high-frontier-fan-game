<!doctype html>
<html><head><meta charset="utf-8"><title>Rat Frontier view</title>
<link rel="stylesheet" href="./css/style.css" />
<link rel="stylesheet" href="./css/map.css" />
<link rel="stylesheet" href="./css/cards.css" />
<style>html,body{margin:0;height:100%;background:#0c0a16;}#view-rat-frontier{position:absolute;inset:0;}</style>
</head><body>
  <section id="view-rat-frontier"></section>
  <script type="module">
    import { mountRatFrontier } from './js/game/rat-frontier/rat-view.js';
    const host = document.getElementById('view-rat-frontier');
    mountRatFrontier(host, { onBack: () => {} });
    window.__ratTab = (name) => {
      const b = [...host.querySelectorAll('.rat-tab')].find(x=>x.dataset.tab===name);
      if (b) b.click();
    };
  </script>
</body></html>
