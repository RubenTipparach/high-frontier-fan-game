<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig 2D</title>
<style>
  :root { --bg: #15181f; --panel: #1f242e; --line: #343b48; --ink: #e6e9ef; --muted: #8e97a8; --accent: #6ab0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #stage { display: grid; place-items: center; overflow: auto; padding: 16px; }
  #card { width: 600px; height: 660px; background: #fff; border-radius: 10px; box-shadow: 0 6px 30px #0008; touch-action: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: var(--muted); padding: 0 4px; }
  label { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
  select, input[type=text], button { background: #12151b; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  input[type=color] { width: 100%; height: 26px; border: 1px solid var(--line); background: none; border-radius: 6px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .joint { cursor: grab; } .joint:hover { fill: var(--accent); }
  textarea { width: 100%; height: 120px; background: #12151b; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 11px monospace; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div id="stage"><svg id="card" viewBox="0 0 300 330"></svg></div>
<aside>
  <h1>Rig 2D</h1>
  <fieldset><legend>Pose</legend>
    <label>Load <select id="poseSrc"></select></label>
    <label>Figure <select id="fid"></select></label>
    <label>Body yaw <input id="yaw" type="range" min="-180" max="180" step="1"></label>
    <label>Head yaw <input id="headYaw" type="range" min="-180" max="180" step="1"></label>
    <label>Near arm <select id="nearArm"><option>L</option><option>R</option></select></label>
    <label>Near leg <select id="nearLeg"><option>L</option><option>R</option></select></label>
    <label><span>Joints</span><span><input id="showJoints" type="checkbox" checked> show &nbsp; <input id="drag" type="checkbox" checked> drag moves children</span></label>
  </fieldset>
  <fieldset><legend>Look</legend>
    <label>Sex <select data-look="sex"><option>female</option><option>male</option></select></label>
    <label>Skin <input type="color" data-look="skin"></label>
    <label>Hair <input type="color" data-look="hair"></label>
    <label>Hair style <select data-look="hairStyle"><option>short</option><option>buzz</option><option>curly</option><option>long</option><option>bun</option><option>white</option><option>bald</option></select></label>
    <label>Profile hair <select data-look="profileHair"><option>short</option><option>buzz</option><option>bob</option><option>long</option></select></label>
    <label>Face <select data-look="face"><option value="auto">auto (head yaw)</option><option value="front">front / 3-4</option><option value="profileR">profile right</option><option value="profileL">profile left</option><option value="back">back</option></select></label>
    <label>Top <select data-look="top"><option>tee</option><option>sport</option><option>shirt</option><option>suit</option><option>coat</option></select></label>
    <label>Top colour <input type="color" data-look="topColor"></label>
    <label>Sleeves <select data-look="sleeves"><option value="">by top</option><option>short</option><option>long</option></select></label>
    <label>Trousers <input type="color" data-look="pants"></label>
    <label>Shoes <input type="color" data-look="shoes"></label>
    <label>Left hand <select data-hand="l"><option>relaxed</option><option>open</option><option>fist</option><option>grip</option><option>point</option></select></label>
    <label>Right hand <select data-hand="r"><option>relaxed</option><option>open</option><option>fist</option><option>grip</option><option>point</option></select></label>
    <label>Eyes closed <input type="checkbox" data-look="eyesClosed"></label>
    <label>Smile <input type="checkbox" data-look="smile"></label>
    <label>Visor <input type="checkbox" id="visor"></label>
  </fieldset>
  <fieldset><legend>Save</legend>
    <div class="row"><button id="dlSvg">Download SVG</button><button id="copy">Copy figure JSON</button><button id="reset">Rest pose</button></div>
    <p class="muted">The figure JSON (pose + look) is what the card art build reads from <code>scripts/rig2d/figures/&lt;card&gt;.json</code>.</p>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="row"><button id="apply">Apply JSON</button></div>
  </fieldset>
</aside>
<script type="module" src="./app.js"></script>
</body>
</html>
