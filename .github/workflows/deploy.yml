name: Deploy High Frontier to GitHub Pages and Fly.io

# Deploy on every push to every branch (and on manual dispatch).
# Each run overwrites the previously deployed Pages site, so the most-
# recent commit on any branch is what ends up live. This matches the
# project's requirement to "deploy on all commits regardless of branch."
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one Pages deploy at a time; cancel any in-flight run
# if a new commit lands first. The deploy-api job has its own concurrency
# group so a Fly deploy is not interrupted by a Pages-only push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull vendored submodules (vendor/hf-mission-planner) so the
          # live site can serve its data-hf4.json. See
          # THIRD_PARTY_NOTICES.md for the AGPL implications.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Smoke-test that the static entry resolves and the Stage 2 data
      # modules parse + meet a minimum size. The data files are imported
      # by both frontend ES modules and (Stage 3+) by the Node server,
      # so failing fast here catches a syntax error before it breaks
      # either world.
      - name: Verify entry + data
        run: |
          test -f index.html
          test -f js/main.js
          test -f css/style.css
          test -f css/map.css
          test -f vendor/hf-mission-planner/assets/data-hf4.json
          node --input-type=module -e "import('./data/sites.js').then(m => { if (!Array.isArray(m.SITES) || m.SITES.length < 20) { console.error('sites.js looks empty:', m.SITES && m.SITES.length); process.exit(1); } if (!Array.isArray(m.EDGES) || m.EDGES.length < 30) { console.error('edges look empty:', m.EDGES && m.EDGES.length); process.exit(1); } });"
          node --input-type=module -e "import('./data/patents.js').then(m => { if (!Array.isArray(m.PATENTS) || m.PATENTS.length < 30) { console.error('patents.js looks empty:', m.PATENTS && m.PATENTS.length); process.exit(1); } });"
          node --input-type=module -e "import('./data/glory.js').then(m => { if (!Array.isArray(m.GLORY) || m.GLORY.length < 6) { console.error('glory.js looks empty:', m.GLORY && m.GLORY.length); process.exit(1); } });"

      # Boot validation gate. Links the WHOLE browser module graph (imports
      # js/main.js with browser globals stubbed) so a broken import - a
      # missing export, a bad path, a parse error, or a duplicate
      # declaration - fails the build BEFORE it deploys, instead of shipping
      # a blank page / the boot-failure banner. This is stronger than
      # `node --check`, which does NOT flag a duplicate declaration in a .js
      # file that uses ESM syntax (that exact gap shipped the 2026-06-02
      # outage). Run the same check locally with `node scripts/check-boot.mjs`.
      - name: Validate boot graph
        run: node scripts/check-boot.mjs

      # Install the build toolchain (esbuild) for the static frontend build.
      - name: Install build deps
        run: npm ci

      # Bundle + minify the frontend into dist/ with content-hashed
      # filenames. The hash IS the cache-bust: a changed module gets a new
      # URL, so browsers (and kept-open tabs, via version-check.js) always
      # fetch fresh - the permanent fix for the stale-module problem that
      # ?v= on the entry alone could not solve. build.mjs also writes
      # version.json and copies the runtime-fetched assets. The commit SHA
      # is injected into version-check.js (esbuild --define) so its hash and
      # version.json track the build.
      - name: Build frontend
        run: BUILD_SHA="$(git rev-parse --short HEAD)" node scripts/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the built site (dist/), NOT the repo root.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Companion API deploy. Runs in parallel with the Pages deploy and
  # only fires on the canonical repo so forks without Fly access fall
  # through cleanly. The Fly app, volume, and secrets must exist before
  # the first run; see README.md "One-time setup" for the bootstrap.
  #
  # Case-insensitive repo gate so a clone under either casing works.
  deploy-api:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["rubentipparach/high-frontier-fan-game", "RubenTipparach/high-frontier-fan-game"]'), github.repository) }}
    concurrency:
      group: fly-api
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Fly image is built from the repo root (see server/Dockerfile)
          # and now bundles vendor/hf-mission-planner so the server can read
          # assets/data-hf4.json at boot (server/game/planner-graph.js builds
          # the ~1500-node movement graph from it). That directory is a git
          # submodule, so without this the deploy checkout would copy an empty
          # vendor/ into the image and the planner graph would load 0 nodes,
          # breaking all server-side rocket movement. The Pages build job
          # already checks out submodules for the same JSON.
          submodules: recursive

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Multi-stage gate. We treat pre-bootstrap as "skip, don't fail":
      # any of (token missing | token invalid | app not yet created)
      # marks the job ready=false and the deploy steps skip. The user
      # has explicit setup steps in README.md "One-time setup" to flip
      # all three to ready=true. A genuine deploy failure post-bootstrap
      # still surfaces as a job failure.
      - name: Check Fly readiness
        id: fly_gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN not set; skipping API deploy. See README.md 'One-time setup'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! flyctl auth whoami > /dev/null 2>&1; then
            echo "::notice::FLY_API_TOKEN is set but rejected by Fly; skipping API deploy. Regenerate via 'fly tokens create deploy -a high-frontier-fan-game'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! flyctl status -a high-frontier-fan-game > /dev/null 2>&1; then
            echo "::notice::Fly app 'high-frontier-fan-game' not found; skipping API deploy. Bootstrap with 'fly apps create high-frontier-fan-game' + 'fly volumes create hf_data --size 1 --region ams'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Single-writer sqlite needs exactly one machine on one volume.
      # Ensure a volume in the primary region and reap any extra app
      # machines before deploy. Both steps are idempotent: no-op if
      # already in the desired state.
      - name: Ensure volume + single machine
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: high-frontier-fan-game
          REGION: ams
        run: |
          set -e
          echo "--- volumes before ---"
          flyctl volumes list -a "$APP"
          VOL_ANY=$(flyctl volumes list -a "$APP" --json | jq '[.[] | select(.name=="hf_data" and .region=="'"$REGION"'")] | length')
          if [ "${VOL_ANY:-0}" -lt 1 ]; then
            echo "Creating volume hf_data in $REGION"
            flyctl volumes create hf_data --size 1 --region "$REGION" --app "$APP" --yes
          else
            echo "Volume hf_data already exists in $REGION"
          fi
          echo "--- machines before ---"
          flyctl machine list -a "$APP"
          flyctl machine list -a "$APP" --json > /tmp/machines.json
          APP_IDS=$(jq -r '.[] | select((.config.metadata.fly_process_group // "app") == "app") | .id' /tmp/machines.json)
          FIRST=""
          for M in $APP_IDS; do
            if [ -z "$FIRST" ]; then
              FIRST="$M"
              echo "Keeping app machine $M"
              continue
            fi
            echo "Destroying extra app machine $M"
            flyctl machine stop "$M" --app "$APP" || true
            flyctl machine destroy "$M" --app "$APP" --force || true
          done
          echo "--- machines after ---"
          flyctl machine list -a "$APP"

      # Stage optional Discord secrets to Fly BEFORE the deploy so the
      # released image boots with them. `--stage` defers the restart so
      # the following `flyctl deploy` applies them in one release (no
      # extra machine bounce). Each secret is only touched when its
      # Actions secret is set, so unset ones are a no-op and we never
      # clobber a value set out-of-band with `fly secrets set`.
      # DISCORD_BOT_TOKEN drives the per-player DMs; the CLIENT_ID /
      # CLIENT_SECRET / GUILD_ID trio enables the one-click "Connect
      # Discord" OAuth flow; DISCORD_WEBHOOK_URL is the channel-webhook
      # default. ADMIN_DISCORD_ID is the Discord user id allowlisted for
      # the /admin panel (server/index.js seeds it into the DB on boot).
      # All are read at boot.
      - name: Sync Discord secrets to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ADMIN_DISCORD_ID: ${{ secrets.ADMIN_DISCORD_ID }}
          APP: high-frontier-fan-game
        run: |
          set -e
          stage_secret() {
            local name="$1" val="$2"
            if [ -n "$val" ]; then
              echo "Staging $name"
              flyctl secrets set "$name=$val" --app "$APP" --stage
            else
              echo "::notice::$name not set in Actions secrets; leaving Fly value untouched."
            fi
          }
          stage_secret DISCORD_BOT_TOKEN     "${DISCORD_BOT_TOKEN}"
          stage_secret DISCORD_CLIENT_ID     "${DISCORD_CLIENT_ID}"
          stage_secret DISCORD_CLIENT_SECRET "${DISCORD_CLIENT_SECRET}"
          stage_secret DISCORD_GUILD_ID      "${DISCORD_GUILD_ID}"
          stage_secret DISCORD_WEBHOOK_URL   "${DISCORD_WEBHOOK_URL}"
          stage_secret ADMIN_DISCORD_ID      "${ADMIN_DISCORD_ID}"

      # Build from the repo root so the image can include both server/
      # and the shared data/ tables the engine imports (see
      # server/Dockerfile). The app + dockerfile are named explicitly
      # since we are no longer in the server/ directory.
      # Fly's remote builder + API can drop the connection transiently
      # (e.g. a regional networking incident), which makes `flyctl deploy`
      # fail within a few seconds, before any build output. Retry with
      # exponential backoff, mirroring the network-retry doctrine the repo
      # already follows for git push/fetch. A genuine, persistent failure
      # still surfaces as a job failure after the final attempt.
      - name: Deploy API to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "::group::flyctl deploy (attempt ${attempt}/4)"
            if flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile .; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 4 ]; then
              backoff=$((attempt * attempt * 10))
              echo "::warning::flyctl deploy failed (attempt ${attempt}/4); retrying in ${backoff}s"
              sleep "${backoff}"
            fi
          done
          echo "::error::flyctl deploy failed after 4 attempts"
          exit 1
