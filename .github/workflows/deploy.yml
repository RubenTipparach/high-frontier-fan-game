name: Deploy High Frontier to GitHub Pages and Fly.io

# Deploy on every push to every branch (and on manual dispatch).
# Each run overwrites the previously deployed Pages site, so the most-
# recent commit on any branch is what ends up live. This matches the
# project's requirement to "deploy on all commits regardless of branch."
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one Pages deploy at a time; cancel any in-flight run
# if a new commit lands first. The deploy-api job has its own concurrency
# group so a Fly deploy is not interrupted by a Pages-only push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull vendored submodules (vendor/hf-mission-planner) so the
          # live site can serve its data-hf4.json. See
          # THIRD_PARTY_NOTICES.md for the AGPL implications.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Smoke-test that the static entry resolves and the Stage 2 data
      # modules parse + meet a minimum size. The data files are imported
      # by both frontend ES modules and (Stage 3+) by the Node server,
      # so failing fast here catches a syntax error before it breaks
      # either world.
      - name: Verify entry + data
        run: |
          test -f index.html
          test -f js/main.js
          test -f css/style.css
          test -f css/map.css
          test -f vendor/hf-mission-planner/assets/data-hf4.json
          node --input-type=module -e "import('./data/sites.js').then(m => { if (!Array.isArray(m.SITES) || m.SITES.length < 20) { console.error('sites.js looks empty:', m.SITES && m.SITES.length); process.exit(1); } if (!Array.isArray(m.EDGES) || m.EDGES.length < 30) { console.error('edges look empty:', m.EDGES && m.EDGES.length); process.exit(1); } });"
          node --input-type=module -e "import('./data/patents.js').then(m => { if (!Array.isArray(m.PATENTS) || m.PATENTS.length < 30) { console.error('patents.js looks empty:', m.PATENTS && m.PATENTS.length); process.exit(1); } });"
          node --input-type=module -e "import('./data/glory.js').then(m => { if (!Array.isArray(m.GLORY) || m.GLORY.length < 6) { console.error('glory.js looks empty:', m.GLORY && m.GLORY.length); process.exit(1); } });"
          node --input-type=module -e "import('./data/politics.js').then(m => { if (!Array.isArray(m.POLITICS) || m.POLITICS.length < 6) { console.error('politics.js looks empty:', m.POLITICS && m.POLITICS.length); process.exit(1); } });"

      # Bake the commit SHA into every cache-bust query and into
      # version.json so the runtime check (js/version-check.js) can
      # force-navigate clients that have a stale index.html cached.
      # Browsers cache ES module imports by URL, so the only reliable
      # way to push a new deploy to a kept-open tab is to change the
      # URLs — which is what these substitutions accomplish.
      - name: Inject build version
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "Build SHA: ${SHA}"
          # Replace ?v=<anything> in index.html with the new SHA.
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" index.html
          # Bake the SHA into the version-check script.
          sed -i "s/__BUILD_SHA__/${SHA}/g" js/version-check.js
          # Emit a tiny JSON the runtime can poll without cache.
          printf '{"version":"%s"}\n' "${SHA}" > version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Companion API deploy. Runs in parallel with the Pages deploy and
  # only fires on the canonical repo so forks without Fly access fall
  # through cleanly. The Fly app, volume, and secrets must exist before
  # the first run; see README.md "One-time setup" for the bootstrap.
  #
  # Case-insensitive repo gate so a clone under either casing works.
  deploy-api:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["rubentipparach/high-frontier-fan-game", "RubenTipparach/high-frontier-fan-game"]'), github.repository) }}
    concurrency:
      group: fly-api
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Multi-stage gate. We treat pre-bootstrap as "skip, don't fail":
      # any of (token missing | token invalid | app not yet created)
      # marks the job ready=false and the deploy steps skip. The user
      # has explicit setup steps in README.md "One-time setup" to flip
      # all three to ready=true. A genuine deploy failure post-bootstrap
      # still surfaces as a job failure.
      - name: Check Fly readiness
        id: fly_gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN not set; skipping API deploy. See README.md 'One-time setup'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! flyctl auth whoami > /dev/null 2>&1; then
            echo "::notice::FLY_API_TOKEN is set but rejected by Fly; skipping API deploy. Regenerate via 'fly tokens create deploy -a high-frontier-fan-game'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! flyctl status -a high-frontier-fan-game > /dev/null 2>&1; then
            echo "::notice::Fly app 'high-frontier-fan-game' not found; skipping API deploy. Bootstrap with 'fly apps create high-frontier-fan-game' + 'fly volumes create hf_data --size 1 --region ams'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Single-writer sqlite needs exactly one machine on one volume.
      # Ensure a volume in the primary region and reap any extra app
      # machines before deploy. Both steps are idempotent: no-op if
      # already in the desired state.
      - name: Ensure volume + single machine
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: high-frontier-fan-game
          REGION: ams
        run: |
          set -e
          echo "--- volumes before ---"
          flyctl volumes list -a "$APP"
          VOL_ANY=$(flyctl volumes list -a "$APP" --json | jq '[.[] | select(.name=="hf_data" and .region=="'"$REGION"'")] | length')
          if [ "${VOL_ANY:-0}" -lt 1 ]; then
            echo "Creating volume hf_data in $REGION"
            flyctl volumes create hf_data --size 1 --region "$REGION" --app "$APP" --yes
          else
            echo "Volume hf_data already exists in $REGION"
          fi
          echo "--- machines before ---"
          flyctl machine list -a "$APP"
          flyctl machine list -a "$APP" --json > /tmp/machines.json
          APP_IDS=$(jq -r '.[] | select((.config.metadata.fly_process_group // "app") == "app") | .id' /tmp/machines.json)
          FIRST=""
          for M in $APP_IDS; do
            if [ -z "$FIRST" ]; then
              FIRST="$M"
              echo "Keeping app machine $M"
              continue
            fi
            echo "Destroying extra app machine $M"
            flyctl machine stop "$M" --app "$APP" || true
            flyctl machine destroy "$M" --app "$APP" --force || true
          done
          echo "--- machines after ---"
          flyctl machine list -a "$APP"

      - name: Deploy API to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
