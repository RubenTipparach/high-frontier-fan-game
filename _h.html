<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/map.css">
<style>body{background:#0a0913;margin:0;padding:20px;} .card-modal-overlay{position:static;background:transparent;display:block;}</style>
<script>
const decks=[['thruster','🚀','#c0506a','Photon Heliogyro'],['reactor','☢','#7e57c2','Pebble Bed Fission'],['radiator','♨','#3a8fb7','Steel / Pb-Bi Pumped Loop'],['refinery','⚗','#3f9e6b','Magma Electrolysis'],['robonaut','🤖','#c08a2e','Solar-Pumped MHD Laser'],['generator','⚡','#caa61e','H2-O2 Fuel Cell']];
window.addEventListener('DOMContentLoaded',()=>{
 const list=document.getElementById('list');
 for(const [dt,g,col,name] of decks){
  const row=document.createElement('div'); row.className='draft-market-row'; row.style.setProperty('--deck-color',col);
  row.innerHTML=`<div class="draft-market-tag"><span class="draft-market-glyph">${g}</span><span class="draft-market-deckname">${dt}</span><span class="draft-market-count">12 left</span></div>`
   +`<div class="draft-market-card"><div style="width:150px;height:120px;border:1px solid #2a2740;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9aa;background:rgba(255,255,255,.03);font-size:12px;padding:6px;text-align:center">${name}</div></div>`
   +`<div class="draft-market-actions"><button class="modal-btn primary draft-market-take">🃏 Take</button><button class="modal-btn draft-market-cycle">♻ Cycle</button></div>`;
  list.appendChild(row);
 }
});
</script></head><body>
<div class="card-modal-overlay draft-market-overlay"><div class="draft-market-panel">
<div class="draft-market-head"><h2>🃏 Draft a card</h2><p class="muted">Take the top card of any deck (free), or cycle one deck once to reveal its next card.</p></div>
<div class="draft-market-list" id="list"></div>
<div class="draft-market-foot"><button class="modal-btn">Close</button></div>
</div></div>
</body></html>
