.copy.mini { min-width:0; min-height:26px; padding:2px 6px; font-size:11px; margin:2px 2px; }
.extra { display:flex; flex-wrap:wrap; align-items:center; gap:0 2px; }
.copy.done { background:var(--ok-soft); border-color:var(--ok); }
.verdict { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.v { font:600 14px var(--body); background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 14px; min-height:38px; cursor:pointer; }
.v[aria-pressed="true"].r { background:var(--ok-soft); border-color:var(--ok); } .v[aria-pressed="true"].w { background:var(--bad-soft); border-color:var(--bad); }
