<!doctype html>
<meta charset="utf-8">
<title>Tutorial steps - Buggy overlay</title>
<style>
  html,body{margin:0;background:#0c0a16;color:#e8e6f2;font-family:ui-sans-serif,system-ui,sans-serif}
  .wrap{padding:24px 28px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{font-size:12.5px;color:#9a97b3;margin:0 0 20px}
  .list{display:flex;flex-direction:column;gap:14px;max-width:760px}
  /* the overlay banner as it will appear docked at the bottom of the board */
  .tut-banner{display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,#171326,#100d1e);
    border:1px solid #34305a;border-left:4px solid #f2812f;border-radius:14px;
    padding:12px 16px 12px 12px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .tut-buggy{flex:0 0 auto;width:96px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .tut-body{flex:1 1 auto;min-width:0}
  .tut-top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .tut-step{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#f2a35c}
  .tut-title{font-size:16px;font-weight:800}
  .tut-instr{font-size:13px;color:#c9c5e4;line-height:1.4}
  .tut-cta{flex:0 0 auto;align-self:center;background:#f2812f;color:#160c04;font-weight:800;
    border:none;border-radius:10px;padding:9px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
  .done .tut-cta{background:#22c55e;color:#052e13}
  .done{border-left-color:#22c55e}
</style>
<div class="wrap">
  <h1>Tutorial &mdash; every step, guided by Buggy</h1>
  <p class="sub">The overlay docks under the board. Buggy points at the control you need (the "Show me" button pulses it); the last step cheers. This is exactly what the player sees at each step.</p>
  <div class="list" id="list"></div>
</div>
<script type="module">
import { buggySvg } from '../js/game/buggy.js';

const steps = [
  ['Auction a card to earn Aqua', 'Put a card up for Research Auction. Your two rivals bid it up to 6 Aqua - sell to the top bidder to bank the money.', 'Show me the auction'],
  ['Win your rocket parts and boost up', 'Put each rocket part up for auction and bid 1 to beat the bots, then boost it to LEO. Repeat until all six parts are in orbit.', 'Show me'],
  ['Assemble the rocket', 'Stack the thruster, its generator, a robonaut and a refinery into a rocket. The generator powers everything.', 'Show me'],
  ['Fuel up', 'Fill your tank from the Aqua bank so you can reach Deimos.', 'Show me refuel'],
  ['Fly to Deimos', 'Plot a route to Deimos and launch. It is 3 delta-v from LEO.', 'Show me'],
  ['Prospect Deimos', 'Prospect Deimos to claim it. Roll the die - the tutorial guarantees a claim.', 'Show me prospect'],
  ['Industrialize Deimos', 'Decommission your robonaut + refinery at Deimos to build a Factory (1 VP).', 'Show me'],
  ['Produce a robonaut', 'Use the Deimos Factory to ET-produce a robonaut from a hand card.', 'Show me'],
  ['Produce a refinery', 'ET-produce a refinery too, so you can industrialize a second site.', 'Show me'],
  ['Hop to Phobos', 'Phobos is one hop from Deimos. Carry the produced robonaut + refinery there.', 'Show me'],
  ['Prospect Phobos', 'Prospect Phobos to claim it (guaranteed).', 'Show me prospect'],
  ['Industrialize Phobos', 'Build your second Factory on Phobos. Mission complete!', 'Finish'],
];
const list = document.getElementById('list');
steps.forEach(([title, instr, cta], i) => {
  const last = i === steps.length - 1;
  const el = document.createElement('div');
  el.className = 'tut-banner' + (last ? ' done' : '');
  el.innerHTML = `
    <div class="tut-buggy">${buggySvg(last ? 'cheer' : 'point')}</div>
    <div class="tut-body">
      <div class="tut-top"><span class="tut-step">Step ${i + 1} / ${steps.length}</span></div>
      <div class="tut-title">${title}</div>
      <div class="tut-instr">${instr}</div>
    </div>
    <button class="tut-cta">${cta}</button>`;
  list.appendChild(el);
});
window.__ready = true;
</script>
