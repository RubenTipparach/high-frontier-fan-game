    <radialGradient id="sph" cx="72.4%" cy="27.6%" r="45%"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="spa" cx="50%" cy="50%" r="50%"><stop offset="0.9" stop-color="#7dd3fc" stop-opacity="0.9"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient></defs><circle cx="30" cy="170" r="74.9" fill="url(#spa)"/>
