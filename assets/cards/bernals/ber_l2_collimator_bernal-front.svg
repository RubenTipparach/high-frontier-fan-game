  <linearGradient id="volL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#0c0a09" stop-opacity="0.4"/></linearGradient>
<linearGradient id="shHull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3e7ee" stop-opacity="1"/><stop offset="0.45" stop-color="#9aa3b2" stop-opacity="1"/><stop offset="1" stop-color="#3b424f" stop-opacity="1"/></linearGradient><radialGradient id="shTank" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f6fa" stop-opacity="1"/><stop offset="0.55" stop-color="#a7b0be" stop-opacity="1"/><stop offset="1" stop-color="#4b5260" stop-opacity="1"/></radialGradient><linearGradient id="shRad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4252" stop-opacity="1"/><stop offset="1" stop-color="#262c38" stop-opacity="1"/></linearGradient><linearGradient id="shPv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a" stop-opacity="1"/><stop offset="1" stop-color="#172554" stop-opacity="1"/></linearGradient>
</defs>
<defs>
