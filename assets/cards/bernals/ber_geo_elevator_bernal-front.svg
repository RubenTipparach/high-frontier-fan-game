<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 288" width="300" height="288">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <radialGradient id="bg"><stop offset="0" stop-color="#000"/></radialGradient><radialGradient id="shd" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#a8a29e" stop-opacity="1"/><stop offset="0.6" stop-color="#78716c" stop-opacity="1"/><stop offset="1" stop-color="#44403c" stop-opacity="1"/></radialGradient><linearGradient id="hul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9" stop-opacity="1"/><stop offset="0.5" stop-color="#cbd5e1" stop-opacity="1"/><stop offset="1" stop-color="#64748b" stop-opacity="1"/></linearGradient>
  <filter id="rgl" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
