<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" width="300" height="330">
  <defs><radialGradient id="sc2-bg" cx="50%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#655ca8"/>
      <stop offset="100%" stop-color="#652d91"/>
    </radialGradient><linearGradient id="sc2-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a5a3c"/><stop offset="100%" stop-color="#4a2c1c"/></linearGradient></defs>
  <rect width="300" height="330" fill="url(#sc2-bg)"/><circle cx="63.7" cy="14.0" r="0.9" fill="#eef0ff" opacity="0.25"/><circle cx="227.9" cy="273.7" r="0.9" fill="#eef0ff" opacity="0.44"/><circle cx="46.5" cy="137.0" r="0.9" fill="#eef0ff" opacity="0.54"/><circle cx="260.1" cy="76.2" r="0.9" fill="#eef0ff" opacity="0.42"/><circle cx="65.0" cy="258.6" r="0.9" fill="#eef0ff" opacity="0.62"/><circle cx="79.9" cy="68.8" r="0.9" fill="#eef0ff" opacity="0.51"/><circle cx="112.0" cy="162.9" r="1.8" fill="#eef0ff" opacity="0.37"/><circle cx="124.4" cy="121.2" r="0.9" fill="#eef0ff" opacity="0.53"/>
      <!-- bearded implantee bust (dark-skinned, distinct from Renaissance Man) -->
      
  <!-- shoulders / upper body -->
  <path d="M35.0,330 Q71.8,227.7 121.5,220.8 Q150,231.8 178.5,220.8 Q228.2,227.7 265.0,330 Z" fill="#3a2c5c"/>
  <!-- short neck -->
  <path d="M131.6,195.5 L128.8,222.8 L171.2,222.8 L168.4,195.5 Z" fill="url(#sc2-skin)"/>
  <ellipse cx="150" cy="151.8" rx="46" ry="51.5" fill="url(#sc2-skin)"/>
  <!-- solid hair cap over the crown + temples -->
  <path d="M104,149.5 Q102.2,96.6 150,94.8 Q197.8,96.6 196,149.5 Q178.5,128.8 161.0,127.9 Q150,131.6 139.0,127.9 Q121.5,128.8 104,149.5 Z" fill="#1a1008"/>
  <!-- full beard along the jaw: thin sideburns from the hair, the top edge low on
       the cheeks so the face shows (a top edge at eye level read as a mask) -->
  <path d="M105.4,149.5 Q104.0,180.3 127.0,197.8 Q150,208.8 173.0,197.8 Q196.0,180.3 194.6,149.5 L189.1,150.9 Q186.8,174.8 169.3,179.4 Q150,184.0 130.7,179.4 Q113.2,174.8 110.9,150.9 Z" fill="#1a1008"/>
  <!-- mustache under the nose, then the mouth in the gap above the beard -->
  <path d="M134.4,171.1 Q150,164.7 165.6,171.1 Q150,174.8 134.4,171.1 Z" fill="#1a1008"/>
  <path d="M142.6,177.6 Q150,179.4 157.4,177.6" stroke="#5a2e22" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- two SEPARATE eyebrows -->
  <path d="M126.1,139.8 q7.4,-4.6 15.6,0.9" stroke="#1a1008" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M158.3,140.8 q8.3,-4.6 15.6,0.9" stroke="#1a1008" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- eyes below the brows -->
  <circle cx="134.4" cy="149.0" r="4.6" fill="#160e08"/>
  <circle cx="165.6" cy="149.0" r="4.6" fill="#160e08"/>
  <!-- nose -->
  <path d="M150,148.1 l-3.2,11.0 q3.2,2.8 6.4,0" stroke="#000" stroke-width="1.4" fill="none" opacity="0.22"/>
  
