<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 166" width="300" height="166">
<defs>
  <linearGradient id="eh-hull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b515b"/>
    <stop offset="0.4" stop-color="#2f343c"/>
    <stop offset="1" stop-color="#111318"/>
  </linearGradient>
  <linearGradient id="eh-hull2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6a6f79"/>
    <stop offset="0.45" stop-color="#3a3f48"/>
    <stop offset="1" stop-color="#14161c"/>
  </linearGradient>
  <radialGradient id="eh-head" cx="0.42" cy="0.34" r="0.72">
    <stop offset="0" stop-color="#5a616c"/>
    <stop offset="0.5" stop-color="#343941"/>
    <stop offset="1" stop-color="#121419"/>
  </radialGradient>
  <linearGradient id="eh-pod" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5c616b"/>
    <stop offset="0.5" stop-color="#33383f"/>
    <stop offset="1" stop-color="#101216"/>
  </linearGradient>
  <radialGradient id="eh-drive" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#d7c4ff" stop-opacity="0.85"/>
    <stop offset="0.6" stop-color="#6a4fd0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#6a4fd0" stop-opacity="0"/>
  </radialGradient>
</defs>

  <!-- ===== BOW POD CLUSTER (far left) ===== -->
  <g stroke="#0d0f14" stroke-width="0.8">
    <rect x="16" y="78" width="40" height="9" rx="4.5" fill="url(#eh-hull2)"/>
    <rect x="10" y="83" width="48" height="11" rx="5.5" fill="url(#eh-hull2)"/>
    <rect x="16" y="90" width="40" height="9" rx="4.5" fill="url(#eh-hull2)"/>
  </g>
  <g fill="#0d0f14">
    <ellipse cx="16" cy="82.5" rx="3" ry="4.5"/>
    <ellipse cx="10" cy="88.5" rx="3.5" ry="5.5"/>
    <ellipse cx="16" cy="94.5" rx="3" ry="4.5"/>
  </g>
  <rect x="52" y="82" width="8" height="13" rx="1.5" fill="url(#eh-hull)" stroke="#0d0f14" stroke-width="0.7"/>

  <!-- ===== LATTICE BOOM / SPINE ===== -->
  <g stroke="#3a3f48" stroke-width="1.5">
    <line x1="58" y1="81" x2="202" y2="81"/>
    <line x1="58" y1="85" x2="202" y2="85"/>
    <line x1="58" y1="88" x2="202" y2="88"/>
    <line x1="58" y1="91" x2="202" y2="91"/>
    <line x1="58" y1="95" x2="202" y2="95"/>
  </g>
  <g stroke="#5a5e66" stroke-width="1.1">
    <line x1="84" y1="80" x2="84" y2="96"/>
    <line x1="116" y1="80" x2="116" y2="96"/>
    <line x1="148" y1="80" x2="148" y2="96"/>
    <line x1="178" y1="80" x2="178" y2="96"/>
  </g>
  <!-- mid-spine mast/antenna -->
  <line x1="120" y1="80" x2="120" y2="54" stroke="#5a5e66" stroke-width="1.3"/>
  <line x1="114" y1="59" x2="126" y2="59" stroke="#5a5e66" stroke-width="1.1"/>
  <circle cx="120" cy="53" r="1.6" fill="#9aa2af"/>

  <!-- ===== ENGINEERING HEAD (right) ===== -->
  <!-- keel tower (descends below the rounded head) -->
  <g fill="url(#eh-hull)" stroke="#0d0f14" stroke-width="0.8">
    <rect x="219" y="112" width="24" height="20"/>
    <rect x="223" y="132" width="16" height="16"/>
    <path d="M225 148 L231 160 L237 148 Z"/>
  </g>
  <!-- top tower stack -->
  <g fill="url(#eh-hull2)" stroke="#0d0f14" stroke-width="0.8">
    <rect x="216" y="46" width="28" height="20"/>
    <rect x="221" y="30" width="18" height="16"/>
    <rect x="224" y="16" width="12" height="14"/>
    <path d="M226 16 L230 5 L234 16 Z"/>
  </g>
  <g stroke="#7c828c" stroke-width="1">
    <line x1="222" y1="16" x2="222" y2="10"/>
    <line x1="238" y1="16" x2="238" y2="10"/>
  </g>

  <!-- rounded main head (domed hull) -->
  <path d="M200 71
           Q200 61 216 59
           Q243 56 257 66
           Q267 74 267 88
           Q267 102 257 110
           Q243 120 216 117
           Q200 115 200 105 Z"
        fill="url(#eh-head)" stroke="#0d0f14" stroke-width="1.3"/>
  <!-- curved hull seams -->
  <g stroke="#0d0f14" stroke-width="0.8" opacity="0.55" fill="none">
    <path d="M202 74 Q234 66 260 72"/>
    <path d="M202 102 Q234 110 260 104"/>
    <path d="M230 60 Q236 88 230 116"/>
  </g>

  <!-- gravity-drive engine (CENTERED on the spine axis, right end) -->
  <circle cx="276" cy="88" r="23" fill="url(#eh-drive)"/>
  <polygon points="258,74 278,67 293,81 293,95 278,109 258,102 251,88"
           fill="url(#eh-pod)" stroke="#0d0f14" stroke-width="1.2"/>
  <g stroke="#0d0f14" stroke-width="0.7" opacity="0.6" fill="none">
    <path d="M258 74 L276 88 L278 109"/>
    <path d="M293 81 L276 88 L258 102"/>
  </g>
  <circle cx="276" cy="88" r="5.5" fill="#cbb6ff" opacity="0.9"/>

  <!-- warm interior window lights across the head + towers -->
  <g fill="#ffe1a0">
    <rect x="208" y="74" width="2" height="1.6"/><rect x="214" y="78" width="2" height="1.6"/>
    <rect x="220" y="74" width="2" height="1.6"/><rect x="226" y="80" width="2" height="1.6"/>
    <rect x="236" y="76" width="2" height="1.6"/><rect x="242" y="81" width="2" height="1.6"/>
    <rect x="248" y="76" width="2" height="1.6"/><rect x="211" y="92" width="2" height="1.6"/>
    <rect x="220" y="96" width="2" height="1.6"/><rect x="238" y="94" width="2" height="1.6"/>
    <rect x="248" y="97" width="2" height="1.6"/><rect x="226" y="52" width="2" height="1.6"/>
    <rect x="232" y="56" width="2" height="1.6"/><rect x="236" y="52" width="2" height="1.6"/>
    <rect x="227" y="120" width="2" height="1.6"/><rect x="233" y="126" width="2" height="1.6"/>
    <rect x="66" y="86" width="2" height="1.6"/><rect x="30" y="88" width="2" height="1.6"/>
  </g>
</svg>
